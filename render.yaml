services:
  - type: web
    name: jingzhu-shop-free
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: off
    buildCommand: sha256sum -c SHA256SUMS && tar -xzf shop-source.tar.gz && npm ci --omit=dev && node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
